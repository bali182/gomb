name: Publish Release

on:
  workflow_call:
    inputs:
      commit:
        required: true
        type: string
      version:
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: desktop-mac
          path: release-assets

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: release-assets

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: web-pages

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ inputs.commit }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" \
            --target "$COMMIT" \
            --title "Gomb v$VERSION" \
            --generate-notes \
            release-assets/*.dmg \
            release-assets/*.exe
