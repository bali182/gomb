name: Build Desktop macOS

on:
  workflow_call:
    inputs:
      commit:
        required: true
        type: string

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package macOS installer
        run: npm run package:mac

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mac
          path: release/*.dmg
          if-no-files-found: error
